<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>应用使用监控</title>
<script>
try { if (localStorage.getItem('uw-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) { }
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f7f9;--card:#ffffff;--sunken:#f0f2f6;--border:#e3e7ee;
  --text:#161b24;--muted:#5f6a7d;--dim:#98a1b0;
  --accent:#2f6fd0;--ok:#1a9b76;--warn:#b8791f;
  --track:#eef1f5;--hit:#eef4fd;--trend:#dde3ec;
}
html[data-theme=dark]{
  --bg:#0a0d13;--card:#12161f;--sunken:#0d1119;--border:#1f2634;
  --text:#e8ecf3;--muted:#8b94a7;--dim:#59627a;
  --accent:#4f9cf9;--ok:#5ac8a8;--warn:#f2a65a;
  --track:#161d29;--hit:#17324f;--trend:#252d3c;
}
html,body{background:var(--bg)}
body{color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .18s,color .18s}
.mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:18px 28px 56px}

.topbar{display:flex;align-items:center;gap:14px;margin-bottom:14px;min-height:30px}
.brand{font-size:12px;color:var(--dim);letter-spacing:.4px;flex:none}
.clock{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;flex:none}
.livebar{display:flex;align-items:center;gap:8px;min-width:0;flex:1;padding-left:6px;border-left:1px solid var(--border)}
.dot{display:block;flex:none;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dot.pulsing{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.lv-label{font-size:13px;font-weight:500;flex:none;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-title{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.lv-timer{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums;flex:none}
.state{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;flex:none}
.btn{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-family:inherit;line-height:1.4;flex:none}
.btn:hover{border-color:var(--dim);color:var(--text)}
.btn.icon{padding:5px 7px;display:flex;align-items:center}
.btn svg{display:block;width:13px;height:13px}

.daterow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.dates{display:flex;gap:6px;flex-wrap:wrap}
.dpick{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:18px;font-size:12px;font-family:inherit;cursor:pointer}
.dchip{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:4px 12px;border-radius:18px;cursor:pointer;font-size:12px;user-select:none;transition:border-color .15s,color .15s}
.dchip:hover{border-color:var(--dim);color:var(--text)}
.dchip.on{background:var(--hit);border-color:var(--accent);color:var(--accent)}

.hero{display:grid;grid-template-columns:1fr 1.02fr;gap:14px;margin-bottom:14px}
.hero-main,.hero-struct{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px}
.cap{color:var(--dim);font-size:11px;letter-spacing:.5px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
.big{font-size:31px;font-weight:500;letter-spacing:-.4px;line-height:1.15;font-variant-numeric:tabular-nums}
.delta{font-size:12px;margin-top:5px;color:var(--muted);min-height:18px}
.delta b{font-weight:500}
.delta .up{color:var(--ok)}
.delta .down{color:var(--warn)}
.subline{display:flex;gap:18px;margin-top:11px;padding-top:11px;border-top:1px solid var(--border);font-size:12px;color:var(--dim);flex-wrap:wrap}
.subline b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.trend{display:flex;align-items:flex-end;gap:2px;height:38px;margin-top:12px}
.tcol{flex:1;min-height:2px;background:var(--trend);border-radius:1.5px 1.5px 0 0;transition:background .15s}
.tcol.hi{background:var(--accent)}
.tcol:hover{background:var(--dim)}

.grow{display:flex;align-items:center;gap:10px;height:27px}
.gname{width:62px;flex:none;font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtrack{flex:1;height:8px;background:var(--track);border-radius:4px;position:relative}
.gfill{height:100%;border-radius:4px;transition:width .4s ease}
.gbase{position:absolute;top:-3px;width:2px;height:14px;background:var(--dim);opacity:.5;border-radius:1px}
.gval{width:78px;flex:none;text-align:right;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.gval i{font-style:normal;color:var(--dim)}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:14px}
.card h2{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.4px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.card h2 em{font-style:normal;color:var(--dim);font-size:11px;font-weight:400}
.grid2{display:grid;grid-template-columns:1.12fr 1fr;gap:14px;align-items:stretch}
.grid2>.card{margin-bottom:14px;display:flex;flex-direction:column}
.grid2>.card>h2{flex:none}

.seg{display:inline-flex;gap:2px;background:var(--sunken);border:1px solid var(--border);border-radius:7px;padding:2px;margin-left:auto}
.seg b{font-size:11px;font-weight:400;color:var(--dim);padding:3px 9px;border-radius:5px;cursor:pointer;user-select:none;transition:background .15s,color .15s}
.seg b:hover{color:var(--muted)}
.seg b.on{background:var(--card);color:var(--text);border:1px solid var(--border);padding:2px 8px}

.rank{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.rank.clickable{cursor:pointer}
.rank.clickable:hover .rname{color:var(--accent)}
.rank.open .rname{color:var(--accent)}
.rname{width:172px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.gtag{display:inline-block;font-size:10px;color:var(--dim);background:var(--sunken);padding:0 5px;border-radius:4px;margin-left:5px;vertical-align:1px}
.rtrack{flex:1;height:7px;background:var(--track);border-radius:4px;overflow:hidden}
.rfill{height:100%;border-radius:4px;transition:width .4s ease}
.rval{width:58px;flex:none;text-align:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.rpct{width:38px;flex:none;text-align:right;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
.pages{margin:-2px 0 10px 0;padding:4px 0 4px 12px;border-left:2px solid var(--border)}
.prow{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;color:var(--dim);padding:1.5px 0}
.prow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow span:last-child{flex:none;font-variant-numeric:tabular-nums;color:var(--muted)}
.rest{opacity:.5}

.notes{list-style:none;flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:12px}
.notes li{position:relative;padding-left:15px;font-size:12.5px;line-height:1.55}
.notes li:before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.notes li.warn:before{background:var(--warn)}
.notes li.ok:before{background:var(--ok)}
.notes .none{color:var(--dim);padding-left:0}
.notes .none:before{display:none}
.notes-foot{font-size:11px;color:var(--dim);margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}

.fold{background:transparent;border:none;margin-bottom:14px}
.fold>summary{list-style:none;cursor:pointer;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 20px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;user-select:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary:hover{color:var(--text);border-color:var(--dim)}
.fold>summary .arrow{display:inline-block;transition:transform .18s;color:var(--dim);font-size:10px}
.fold[open]>summary .arrow{transform:rotate(90deg)}
.fold[open]>summary{margin-bottom:14px}
.fold .card{margin-bottom:14px}

.hbars{display:flex;align-items:stretch;gap:4px;height:130px;padding-top:6px}
.hcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;gap:6px}
.hstack{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;border-radius:3px 3px 0 0;background:var(--track)}
.hbar{width:100%;min-height:1px;opacity:.92}
.hlab{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}

svg{display:block;width:100%;height:auto;overflow:visible}
#tip{position:fixed;pointer-events:none;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;display:none;z-index:99;white-space:nowrap;color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.13)}
.empty{padding:60px;text-align:center;color:var(--dim)}
.foot{color:var(--dim);font-size:11px;text-align:center;margin-top:20px}

body.static .topbar{justify-content:flex-end;margin-bottom:8px}
body.static .brand,body.static .clock,body.static .livebar,body.static .state,body.static #btn-pause{display:none}
body.static .daterow{display:none}
body.static .subline{margin-top:10px}

@media(max-width:900px){
  .hero{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .lv-title{display:none}
  .wrap{padding:14px 16px 40px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="brand">usagewatch</span>
    <span class="clock" id="clock">--:--:--</span>
    <span class="livebar">
      <span class="dot pulsing" id="dot"></span>
      <span class="lv-label" id="lv-label">—</span>
      <span class="lv-title" id="lv-title"></span>
      <span class="lv-timer" id="lv-timer">00:00:00</span>
    </span>
    <span class="state" id="state-text">连接中…</span>
    <button class="btn icon" id="btn-theme" title="切换亮色 / 暗色"></button>
    <button class="btn" id="btn-pause">暂停采集</button>
  </div>

  <div class="daterow">
    <div class="dates" id="dates"></div>
    <input type="date" id="datepick" class="dpick" title="跳转到指定日期">
  </div>

  <div id="dash">
    <section class="hero">
      <div class="hero-main">
        <div class="cap"><span id="hd-date">—</span><span class="mono" id="hd-week"></span></div>
        <div class="big" id="k-total">-</div>
        <div class="delta" id="k-delta"></div>
        <div class="subline">
          <span>覆盖 <b id="k-cover">-</b></span>
          <span>切换 <b id="k-switch">-</b></span>
          <span>专注 <b id="k-focus">-</b></span>
          <span>跨度 <b id="k-span">-</b></span>
        </div>
        <div class="trend" id="trend"></div>
      </div>
      <div class="hero-struct">
        <div class="cap"><span>分类结构</span><span style="letter-spacing:0">竖线为近 30 天中位</span></div>
        <div id="groups"></div>
      </div>
    </section>

    <section class="card">
      <h2>全天节奏 <em id="tl-note"></em></h2>
      <div id="timeline"></div>
    </section>

    <div class="grid2">
      <section class="card">
        <h2>去处分布<span class="seg" id="dest-tabs"><b data-v="site" class="on">站点</b><b data-v="group">分类</b><b data-v="app">应用</b></span></h2>
        <div id="dest"></div>
      </section>
      <section class="card">
        <h2>值得注意</h2>
        <ul class="notes" id="notes"></ul>
        <div class="notes-foot" id="notes-foot"></div>
      </section>
    </div>

    <details class="fold" id="fold">
      <summary><span>更细的时间视角</span><span class="arrow">▸</span></summary>
      <section class="card">
        <h2>每小时活跃 <em>按分类堆叠，hover 看构成</em></h2>
        <div class="hbars" id="hourly"></div>
      </section>
      <section class="card">
        <h2>各站点时间分布 <em>hover 查看明细</em></h2>
        <div id="gantt"></div>
      </section>
    </details>
  </div>

  <div class="foot">usagewatch · 数据仅存本地</div>
</div>
<div id="tip"></div>
<!--RENDER_JS-->
<script>
/*__BOOT__*/
(function () {
  if (window.__STATIC__) return;

  const todayStr = () => new Date().toLocaleDateString('sv');
  let TODAY = todayStr();
  const pad = n => String(n).padStart(2, '0');
  const clockStr = s => pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(Math.floor(s % 60));

  const deepDate = new URLSearchParams(location.search).get('d');
  let base = 0, baseAt = 0, paused = false, curDate = deepDate || TODAY;
  let baseline = null;

  setInterval(() => {
    if (base > 0) document.getElementById('lv-timer').textContent = clockStr(base + (Date.now() - baseAt) / 1000);
  }, 250);

  function setState(ok, isPaused) {
    const dot = document.getElementById('dot');
    dot.classList.remove('pulsing');
    dot.style.background = !ok ? 'var(--dim)' : isPaused ? 'var(--warn)' : 'var(--ok)';
    if (ok && !isPaused) dot.classList.add('pulsing');
    document.getElementById('state-text').textContent = !ok ? '未连接' : isPaused ? '已暂停' : '采集中';
  }

  async function loadLive() {
    try {
      const d = await (await fetch('/api/live')).json();
      document.getElementById('clock').textContent = d.now;
      document.getElementById('lv-label').textContent = d.label || '—';
      const bits = [];
      if (d.app && d.app !== d.label) bits.push(d.app);
      if (d.title && d.title !== d.label) bits.push(d.title);
      document.getElementById('lv-title').textContent = bits.join(' · ');
      base = d.sinceSec;
      baseAt = Date.now();
      if (!d.active) { base = 0; document.getElementById('lv-timer').textContent = '00:00:00'; }
      paused = d.paused;
      setState(true, d.paused);
      document.getElementById('btn-pause').textContent = d.paused ? '恢复采集' : '暂停采集';
    } catch (e) {
      setState(false, false);
    }
  }

  async function loadDates(keepSel) {
    try {
      TODAY = todayStr();
      const list = await (await fetch('/api/dates')).json();
      const others = list.filter(x => x !== TODAY).slice(0, 13);
      const box = document.getElementById('dates');
      const sel = keepSel !== undefined ? keepSel : (curDate === TODAY ? '' : curDate);
      box.innerHTML = `<div class="dchip" data-d="">今日 ${TODAY.slice(5)}</div>` +
        others.map(d => `<div class="dchip" data-d="${d}">${d.slice(5)}</div>`).join('');
      box.querySelectorAll('.dchip').forEach(c => {
        const d = c.dataset.d || '';
        if (d === sel) c.classList.add('on');
        c.onclick = () => {
          box.querySelectorAll('.dchip').forEach(x => x.classList.remove('on'));
          c.classList.add('on');
          curDate = d || TODAY;
          try { history.replaceState(null, '', d ? '?d=' + d : location.pathname); } catch (e) { }
          loadDay(d || null);
        };
      });
      const pick = document.getElementById('datepick');
      if (pick) pick.value = sel || TODAY;
    } catch (e) { }
  }

  async function loadBaseline() {
    try {
      baseline = await (await fetch('/api/baseline')).json();
      if (window.renderDashboard && window.__lastDay) window.renderDashboard(window.__lastDay, baseline);
    } catch (e) { baseline = null; }
  }

  async function loadDay(d) {
    try {
      const r = await fetch('/api/day' + (d ? '?d=' + d : ''));
      const data = await r.json();
      window.__lastDay = data;
      if (window.renderDashboard) window.renderDashboard(data, baseline);
      curDate = data.date;
    } catch (e) { }
  }

  document.getElementById('btn-pause').onclick = async () => {
    await fetch(paused ? '/api/resume' : '/api/pause', { method: 'POST', body: '' });
    setTimeout(loadLive, 250);
  };

  const picker = document.getElementById('datepick');
  if (picker) picker.onchange = () => {
    if (!picker.value) return;
    curDate = picker.value;
    document.querySelectorAll('#dates .dchip').forEach(x => x.classList.remove('on'));
    try { history.replaceState(null, '', '?d=' + picker.value); } catch (e) { }
    loadDay(picker.value);
  };

  const deepView = new URLSearchParams(location.search).get('view');
  if (deepView && window.setDestView) window.setDestView(deepView);

  loadLive(); loadDates(); loadBaseline();
  loadDay(deepDate || null);
  setInterval(loadLive, 2000);
  setInterval(() => { if (!document.hidden) loadDay(curDate === todayStr() ? null : curDate); }, 15000);
  setInterval(() => { if (!document.hidden) loadDates(); }, 60000);
  setInterval(() => { if (!document.hidden) loadBaseline(); }, 300000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    loadDates(); loadLive();
    loadDay(curDate === todayStr() ? null : curDate);
  });
})();
</script>
</body>
</html>
