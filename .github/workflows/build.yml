name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 项目依赖 Win32 API（GetForegroundWindow / GetLastInputInfo）与 WinForms 托盘，
    # 必须在 windows runner 上编译，linux/macos 会直接失败。
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Publish
        run: dotnet publish -c Release -o out --nologo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: usagewatch-win-x64
          path: out/
          if-no-files-found: error

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path out/* -DestinationPath "usagewatch-${{ github.ref_name }}-win-x64.zip"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          gh release create "${{ github.ref_name }}"
          "usagewatch-${{ github.ref_name }}-win-x64.zip"
          --title "${{ github.ref_name }}"
          --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
